name: KitchenHub
options:
  bundleIdPrefix: com.tobyblunt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7KYR2X9MJA
    CODE_SIGN_STYLE: Automatic
    # Shared by the app and its extension: their versions must match.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  KitchenHub:
    type: application
    platform: iOS
    sources:
      - KitchenHub
      - Shared
    dependencies:
      - target: KitchenHubShare
    entitlements:
      path: KitchenHub/KitchenHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tobyblunt.kitchenhub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobyblunt.kitchenhub
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: KitchenHub/Info.plist
      properties:
        CFBundleDisplayName: Kitchen Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only standard HTTPS: exempt, so TestFlight doesn't hold each build for export compliance.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Kitchen Hub uses the camera to scan recipes from cookbooks and recipe cards.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Recipe
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.image
              - public.plain-text
              - public.html
        NSLocalNetworkUsageDescription: Kitchen Hub runs a small web page on your Wi-Fi so you can send recipes to this iPad from your phone or computer.
        CFBundleURLTypes:
          - CFBundleURLName: com.tobyblunt.kitchenhub
            CFBundleURLSchemes:
              - kitchenhub
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  KitchenHubShare:
    type: app-extension
    platform: iOS
    sources:
      - KitchenHubShare
      - Shared
    entitlements:
      path: KitchenHubShare/KitchenHubShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tobyblunt.kitchenhub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobyblunt.kitchenhub.share
        TARGETED_DEVICE_FAMILY: "2"
    info:
      path: KitchenHubShare/Info.plist
      properties:
        CFBundleDisplayName: Kitchen Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 5
